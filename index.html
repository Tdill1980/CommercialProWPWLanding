<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CommercialPro — Wholesale Vehicle Wrap Printing | WePrintWraps</title>
    <meta
      name="description"
      content="Wholesale wrap printing for shops that don't own printers. Volume pricing to $4.22/sq ft, 3M and Avery film, 1–2 business day production, 3D proofs that sell the job."
    />
    <meta name="author" content="WePrintWraps" />
    <!--
      Canonical points at the WORDPRESS page, not at this origin.

      This app self-canonicalised to bright-fleet-flow.lovable.app while
      weprintwraps.com/commercialpro/ (live, HTTP 200) serves the same content
      through the /embed/commercial iframe. Two indexable URLs for one page
      split the ranking signals, and the lovable.app domain can outrank
      weprintwraps.com for your own product — the exact outcome the embed plan
      set out to avoid ("leave the embed route's noindex in place so it never
      competes with /commercialpro/").

      /embed/commercial is already noindex, but the ROOT was not, and the
      generated sitemap was actively inviting Google to index it at priority
      1.0. Canonical is what actually consolidates the signal: crawl this URL
      all you like, credit belongs to weprintwraps.com.
    -->
    <link rel="canonical" href="https://weprintwraps.com/commercialpro/" />

    <meta property="og:title" content="CommercialPro — Wholesale Vehicle Wrap Printing" />
    <meta
      property="og:description"
      content="You sell it and install it — we preflight, print, laminate, label and ship. Volume discounts apply automatically."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WePrintWraps" />
    <meta
      property="og:image"
      content="https://kfapjdyythzyvnpdeghu.supabase.co/storage/v1/object/public/wrap-files/commercialpro-email/hero-1200.jpg"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CommercialPro — Wholesale Vehicle Wrap Printing" />
    <meta
      name="twitter:description"
      content="You sell it and install it — we preflight, print, laminate, label and ship. Volume discounts apply automatically."
    />
    <meta
      name="twitter:image"
      content="https://kfapjdyythzyvnpdeghu.supabase.co/storage/v1/object/public/wrap-files/commercialpro-email/hero-1200.jpg"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://bright-fleet-flow.lovable.app/#organization",
            "name": "WePrintWraps",
            "url": "https://weprintwraps.com",
            "description": "Wholesale vehicle and wall wrap printing for sign shops, installers and commercial fleets."
          },
          {
            "@type": "WebSite",
            "@id": "https://bright-fleet-flow.lovable.app/#website",
            "url": "https://weprintwraps.com/commercialpro/",
            "name": "WePrintWraps CommercialPro",
            "publisher": { "@id": "https://bright-fleet-flow.lovable.app/#organization" }
          },
          {
            "@type": "Service",
            "name": "Wholesale Vehicle Wrap Printing",
            "serviceType": "Vehicle wrap printing",
            "provider": { "@id": "https://bright-fleet-flow.lovable.app/#organization" },
            "areaServed": "US",
            "url": "https://weprintwraps.com/commercialpro/",
            "description": "Volume-priced printed vehicle wrap film with 3M and Avery materials, free 3D proofs, and 1–2 business day production."
          }
        ]
      }
    </script>

    <!--
      ANALYTICS. This page had none of it — no GA, no Klaviyo, no pixel — which
      is why campaigns pointing here reported clicks and $0. Klaviyo tags every
      email link with utm_source/medium/campaign/id, and a destination with no
      analytics cannot read them, so a campaign that sold looked like one that
      failed.

      Both properties are the same ones the main site uses, so this page's
      traffic joins the existing reporting instead of forming an island.

      NOTE ON THE IFRAME: when /embed/commercial is framed on
      weprintwraps.com/commercialpro, the UTMs sit on the PARENT url, not on
      this one — GA here will attribute the embed itself. Campaign links should
      therefore point at the WordPress page, not at this origin, once the embed
      is live. Direct visits to this origin (today's email links) do carry the
      UTMs and are captured normally.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MZV0FBG7XJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MZV0FBG7XJ');
    </script>

    <!-- Klaviyo onsite. XQZdm5 is the account's PUBLIC api key (site id), not a
         secret — it is the same value Klaviyo prints in its own embed snippet. -->
    <script async type="text/javascript" src="https://static.klaviyo.com/onsite/js/XQZdm5/klaviyo.js"></script>

    <!-- Meta Pixel: intentionally NOT wired yet. The main app takes its id from
         VITE_FACEBOOK_PIXEL_ID rather than hard-coding it, so the value is not
         in source anywhere. Add it here with the real id — a placeholder would
         load and silently report nothing, which is worse than an obvious gap. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
